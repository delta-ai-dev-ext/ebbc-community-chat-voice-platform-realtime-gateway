# Local development dependencies for realtime_gateway.
#
# This file documents how to run the gateway's *external* dependencies locally. It is NOT
# used by the test suite: every automated test runs without a broker, Docker or network
# egress (fakes are injected in-process).
#
#   docker compose up -d          # start a single-node broker + topic bootstrap
#   make run                      # run the gateway against it (see .env.example)
#
# Redpanda is used as a Kafka API compatible broker so no ZooKeeper/JVM is required.

services:
  kafka:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Single listener that advertises localhost for host-side clients.
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the five consumed topics once the broker is healthy. One partition each is
  # enough locally; production topics are provisioned by the platform.
  kafka-topics:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk topic create message_events voice_events community_events social_events
        notification_events --brokers kafka:9092
